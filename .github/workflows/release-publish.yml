name: "Publish new release"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Publish new release
    runs-on: ubuntu-latest
    steps:
      - name: Connect Bot
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.BOT_SSH_PRIVATE_KEY }}

      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/ruby-cache

      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}

      - name: "Fastlane - Publish Release"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bundle exec fastlane publish_release --verbose

  merge-main-to-develop:
    name: Merge main to develop
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          token: ${{ secrets.ADMIN_API_TOKEN }}
          fetch-depth: 0

      - uses: ./.github/actions/ruby-cache

      - run: bundle exec fastlane merge_main
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
